name: Stage approved LinkedIn thumbnails

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  stage-media:
    if: startsWith(github.event.issue.title, '[MEDIA]') && github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Fetch approved images and stage stable public URLs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, urllib.request, urllib.parse
          event = json.load(open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8"))
          files = json.loads(event["issue"]["body"])["files"]
          allowed = {"utm-atm": "utm-atm", "evtol": "evtol"}
          outputs = []
          for spec in files:
              label = spec["label"]
              if label not in allowed:
                  raise ValueError("Invalid asset label")
              url = spec["url"]
              if urllib.parse.urlparse(url).hostname != "media.canva.com" or not url.startswith("https://"):
                  raise ValueError("Media source must be Canva HTTPS")
              with urllib.request.urlopen(url, timeout=35) as result:
                  body = result.read(7_000_000)
              if not (body.startswith(b"\x89PNG\r\n\x1a\n") or body.startswith(b"\xff\xd8\xff")):
                  raise ValueError("Downloaded content is not an image")
              ext = ".png" if body.startswith(b"\x89PNG") else ".jpg"
              target = pathlib.Path("assets/linkedin") / ("2026-11-20-" + label + ext)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(body)
              outputs.append(str(target))
          pathlib.Path("/tmp/assets.txt").write_text("\n".join(outputs), encoding="utf-8")
          PY

      - name: Commit thumbnails
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/linkedin/
          git diff --cached --quiet || (git commit -m "Stage approved LinkedIn thumbnails 2026-11-20" && git push)

      - name: Confirm public image URLs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python3 - <<'PY'
          import os, pathlib, json, urllib.request
          repo = os.environ["GITHUB_REPOSITORY"]
          paths = pathlib.Path("/tmp/assets.txt").read_text(encoding="utf-8").splitlines()
          lines = ["Media staged successfully:"]
          for path in paths:
              lines.append(f"- https://raw.githubusercontent.com/{repo}/main/{path}")
          payload = json.dumps({"body":"\n".join(lines)}).encode("utf-8")
          req = urllib.request.Request(
             f"https://api.github.com/repos/{repo}/issues/{os.environ['ISSUE_NUMBER']}/comments",
             data=payload, method="POST",
             headers={"Authorization":f"Bearer {os.environ['GITHUB_TOKEN']}",
                      "Content-Type":"application/json","Accept":"application/vnd.github+json"}
          )
          with urllib.request.urlopen(req, timeout=30) as res:
              assert res.status == 201
          PY
